title: Aarif Khan
description: >-
  Personal site of Aarif Khan, a software engineer specializing in
  Computer Science and Mathematics. Read the blog, browse projects,
  and view the resume.
url: "https://aarifkhan.com"
social:
  name: Aarif Khan
  links:
    - https://www.linkedin.com/in/aarif-khan-b1aa97171/

author:
  name: Aarif Khan
  email: aarifkhannitrr@gmail.com
  linkedin: https://www.linkedin.com/in/aarif-khan-b1aa97171/

# Nav links shown in the header, in order.
nav:
  - title: Home
    path: /
  - title: Projects
    path: /projects/
  - title: Blog
    path: /blog/
  - title: Contact
    path: /contact/

collections:
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: page
  - scope:
      path: ""
    values:
      layout: page

markdown: kramdown
permalink: /:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - seo-analysis.pdf
